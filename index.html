<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Boss Tetris</title>

<!-- PWA -->
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#f4a94d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Boss Tetris">
<link rel="apple-touch-icon" href="https://raw.githubusercontent.com/paulie0102-Bear/catch/refs/heads/main/character/Quokka-battle.png">
<style>
:root{
  --bg:#fbf3e3; --panel:#ffffff; --panel2:#ffe9c4; --line:#ecdab3;
  --text:#4a3520; --sub:#a3835c; --accent:#f4a94d; --accent-ink:#4a2f00; --accent2:#ff6b6b;
  --hp-full:#5ee6c8; --hp-mid:#f2c14e; --hp-low:#ff5a5a;
  --deep:#2a2018; --deepline:#4a3d2c;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans TC",sans-serif;
  overflow-x:hidden; width:100%; height:100%; overscroll-behavior:none;}
#app{position:relative; width:100%; max-width:520px; margin:0 auto; min-height:100vh;
  background:var(--bg); overflow:hidden;}
.screen{display:none; position:absolute; inset:0; flex-direction:column; padding-top:var(--safe-t);}
.screen.active{display:flex;}
.topbar{display:flex; align-items:center; padding:12px 14px; flex-shrink:0;}
.backBtn{background:var(--panel); border:1px solid var(--line); color:var(--text);
  padding:8px 14px; border-radius:14px; font-size:14px; font-weight:600; touch-action:manipulation;}
.backBtn:active, .backBtn.pressed{background:var(--panel2);}
.topbar h2{margin:0 0 0 12px; font-size:16px; font-weight:700; color:var(--sub); letter-spacing:1px;}

/* HOME (light, cute theme) */
#homeScreen{padding-top:0; background:var(--bg);}
#homeCanvasFrame{position:relative; flex:1; margin:14px 14px 10px; border-radius:26px;
  border:3px solid var(--line); background:var(--panel); overflow:hidden;
  box-shadow:0 6px 18px rgba(180,140,80,.12), inset 0 0 0 1px rgba(255,255,255,.6);}
#homeCanvas{position:absolute; inset:0; overflow:hidden; background:transparent;}
#homeCanvas.editing{outline:3px dashed var(--accent); outline-offset:-4px;}
.deco{position:absolute; font-size:40px; line-height:1; touch-action:none; cursor:grab;
  transform-origin:center center; filter:drop-shadow(0 2px 6px rgba(0,0,0,.25));}
.deco.bgLayer{z-index:0;}
.deco.selected{outline:2px dashed var(--accent); border-radius:8px;}
.decoImg{width:56px; height:56px; object-fit:contain; display:block; pointer-events:none; -webkit-user-drag:none;}
#decoToolbar{position:absolute; display:none; background:var(--panel); border:1px solid var(--line);
  border-radius:14px; padding:8px; gap:6px;
  grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr;
  width:150px; z-index:50;
  box-shadow:0 6px 18px rgba(0,0,0,.15);}
#decoToolbar button{background:var(--panel2); color:var(--text); border:none;
  border-radius:10px; padding:6px 4px; font-size:12px; font-weight:600; touch-action:manipulation;
  white-space:nowrap; width:100%; height:36px;}
#decoToolbar .scaleCell{display:flex; flex-direction:column; align-items:center; justify-content:center;
  background:var(--panel2); border-radius:10px; height:36px; padding:0 8px;}
#decoToolbar .scaleCell span{font-size:11px; color:var(--sub); margin-bottom:1px;}
#decoToolbar input[type=range]{width:100%; margin:0;}

#gramophone{position:absolute; right:14px; bottom:14px; width:54px; height:54px;
  border-radius:50%; cursor:pointer; touch-action:manipulation;
  background:
    radial-gradient(circle at 50% 50%, var(--accent) 0 7px, #161616 8px, #161616 100%),
    repeating-radial-gradient(circle at 50% 50%, #333 0px, #333 1px, #101010 1px, #101010 4px);
  border:3px solid #fff; z-index:20; box-shadow:0 4px 14px rgba(0,0,0,.25);}
/* 反光光影：同心圓紋理本身是旋轉對稱的，單靠 transform:rotate 肉眼幾乎看不出在轉，
   額外疊加一道非對稱的高光弧，隨唱片一起旋轉時才會有明顯「正在轉動」的感覺 */
#gramophone::before{content:''; position:absolute; inset:0; border-radius:50%;
  background:conic-gradient(from -40deg,
    rgba(255,255,255,0) 0deg, rgba(255,255,255,.65) 18deg, rgba(255,255,255,0) 42deg,
    rgba(255,255,255,0) 190deg, rgba(255,255,255,.28) 208deg, rgba(255,255,255,0) 226deg,
    rgba(255,255,255,0) 360deg);
  mix-blend-mode:screen; pointer-events:none;}
#gramophone::after{content:''; position:absolute; left:50%; top:50%; width:6px; height:6px;
  background:#161616; border-radius:50%; transform:translate(-50%,-50%);
  box-shadow:0 0 0 1px rgba(255,255,255,.5); z-index:1;}
#gramophone.playing{animation:spin 4s linear infinite;}
@keyframes spin{from{transform:rotate(0)} to{transform:rotate(360deg)}}

.homeEditBtn{position:absolute; left:24px; top:calc(24px + var(--safe-t)); background:var(--panel);
  border:none; color:var(--sub); padding:9px 16px; border-radius:20px; font-size:12px; font-weight:700;
  z-index:20; box-shadow:0 3px 10px rgba(180,140,80,.25); touch-action:manipulation;}
.homeEditBtn.on{background:var(--accent); color:var(--accent-ink);}

/* NAV (cute rounded pastel buttons, unified tactile feedback) */
#navBar{display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; gap:10px;
  background:var(--panel); flex-shrink:0; height:158px; padding:10px 14px calc(10px + var(--safe-b));
  border-top-left-radius:26px; border-top-right-radius:26px; box-shadow:0 -6px 20px rgba(0,0,0,.06);}
#navBar button{border:none; font-size:13px; font-weight:700; border-radius:20px;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
  letter-spacing:1px; transition:transform .08s ease; touch-action:manipulation; -webkit-user-select:none;}
#navBar button .navIcon{font-size:22px;}
#navBar button:nth-child(1){background:#dff5ec; color:#1f7a5c;}
#navBar button:nth-child(2){background:#e9e6ff; color:#5b4fc4;}
#navBar button:nth-child(3){background:#ffe9ef; color:#c14b7a;}
#navBar button:nth-child(4){background:#fff3d6; color:#a3760f;}
#navBar button.pressed, #navBar button:active{transform:scale(.92); filter:brightness(.96);}

/* GENERIC PANEL BODY */
.panelBody{flex:1; overflow-y:auto; padding:16px; padding-bottom:calc(24px + var(--safe-b)); background:var(--bg);}

/* STAGE / LEVEL SELECT */
.bossPortraitWrap{display:flex; flex-direction:column; align-items:center; padding:20px 16px 8px;}
#bossImg{width:min(58vw,240px); height:min(58vw,240px); object-fit:contain;
  filter:drop-shadow(0 8px 24px rgba(0,0,0,.35));}
.bossName{margin-top:8px; font-size:16px; font-weight:700; color:var(--text);}
.hpBarOuter{width:88%; max-width:360px; height:16px; background:var(--deep); border-radius:10px;
  overflow:hidden; margin-top:14px; border:1px solid var(--deepline);}
.hpBarInner{height:100%; background:linear-gradient(90deg,var(--hp-full),#3fcbb0); width:100%;
  transition:width .35s ease;}
.staminaRow{display:flex; gap:6px; margin-top:18px;}
.staminaDot{width:14px; height:14px; border-radius:50%; background:var(--panel2); border:1px solid var(--line);}
.staminaDot.filled{background:var(--accent);}
.staminaLabel{margin-top:8px; font-size:13px; color:var(--sub);}
#startBattleBtn{margin-top:22px; background:var(--accent); color:var(--accent-ink); font-weight:700;
  border:none; border-radius:14px; padding:14px 44px; font-size:16px; touch-action:manipulation;}
#startBattleBtn:disabled{background:var(--panel2); color:var(--sub);}

/* BATTLE */
#battleScreen{background:var(--bg);}
#battleMain{flex:1; display:flex; flex-direction:row; min-height:0; padding:6px 6px calc(4px + var(--safe-b)); gap:6px;}
#leftPanel{flex:1; min-width:0; min-height:0; display:flex; flex-direction:column;}
#boardWrap{flex:1; min-height:0; display:flex; align-items:center; justify-content:center; overflow:visible;}
#board{display:grid; grid-template-columns:repeat(10,1fr); grid-template-rows:repeat(20,1fr);
  background:var(--deep); border:2px solid var(--deepline); border-radius:6px; overflow:hidden; flex-shrink:0;}
.cell{border:1px solid rgba(255,255,255,.04); box-sizing:border-box;}
.controls{display:flex; padding:8px 2px 4px; gap:8px; flex-shrink:0;}
.ctrlBtn{flex:1; background:var(--panel); border:1px solid var(--line); border-radius:14px;
  color:var(--text); font-size:22px; height:58px; display:flex; align-items:center; justify-content:center;
  touch-action:none;}
.ctrlBtn:active{background:var(--panel2);}

#battlePauseOverlay{position:fixed; inset:0; background:rgba(20,14,6,.55); opacity:0; pointer-events:none;
  transition:opacity .3s ease; z-index:400;}

#rightPanel{width:112px; flex-shrink:0; display:flex; flex-direction:column; align-items:center;
  gap:10px; padding-top:2px; overflow:visible;}
#leaveBattleBtn{width:32px; height:32px; border-radius:50%; background:var(--panel);
  border:1px solid var(--line); color:var(--sub); font-size:15px; flex-shrink:0;}
#leaveBattleBtn:active{background:var(--panel2);}
#bossCorner{display:flex; flex-direction:column; align-items:center; gap:6px; overflow:visible; padding:4px 0;}
#bossImgBattle{width:88px; height:88px; object-fit:contain; will-change:transform;}
.hpBarOuter.battle{width:96px; max-width:96px; height:8px; margin-top:0;}
.nextCol{display:flex; flex-direction:column; align-items:center; gap:8px;}
.nextLabel{font-size:10px; color:var(--sub); letter-spacing:2px;}
.nextBox{width:52px; height:52px; background:var(--deep); border:1px solid var(--deepline); border-radius:6px;
  display:grid; grid-template-columns:repeat(4,1fr); grid-template-rows:repeat(4,1fr);}
.nextBox .cell{border:none;}

.piece-I,.piece-O,.piece-T,.piece-S,.piece-Z,.piece-J,.piece-L{
  border-radius:3px; box-shadow:inset 0 0 0 2px rgba(255,255,255,.3), inset -4px -4px 6px rgba(0,0,0,.35),
  inset 3px 3px 4px rgba(255,255,255,.3);}
.piece-I{background:linear-gradient(150deg,#8ff0ff,#22aecf);}
.piece-O{background:linear-gradient(150deg,#fff6a0,#dfb92e);}
.piece-T{background:linear-gradient(150deg,#eab4ff,#a244d6);}
.piece-S{background:linear-gradient(150deg,#adffc7,#33c96a);}
.piece-Z{background:linear-gradient(150deg,#ffb6b6,#dd4444);}
.piece-J{background:linear-gradient(150deg,#b0c4ff,#4863d9);}
.piece-L{background:linear-gradient(150deg,#ffd7a0,#dd8a30);}
.piece-garbage{background:linear-gradient(150deg,#54545e,#28282e); box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);}
.piece-bomb{background:radial-gradient(circle at 35% 35%,#4a4a4a,#0e0e0e 70%); box-shadow:inset 0 0 0 1px rgba(255,255,255,.1);}
.cell.ghost{opacity:.32; box-shadow:none !important; outline:2px solid rgba(255,255,255,.55); outline-offset:-2px; border-radius:3px;}
.piece-bomb::after{content:'💣'; display:flex; align-items:center; justify-content:center; font-size:70%;}

.shakeBoss{animation:bossShake .45s ease;}
@keyframes bossShake{
  0%{transform:scale(1) rotate(0)}
  20%{transform:scale(1.35) rotate(-6deg)}
  40%{transform:scale(1.35) rotate(6deg)}
  60%{transform:scale(1.25) rotate(-5deg)}
  80%{transform:scale(1.15) rotate(3deg)}
  100%{transform:scale(1) rotate(0)}
}
@media (prefers-reduced-motion: reduce){ .shakeBoss{animation:none;} #gramophone.playing{animation:none;} .musicRowIcon.spinning{animation:none;} }

/* RESULT */
#resultOverlay, #gameoverOverlay{position:absolute; inset:0; background:rgba(0,0,0,.85);
  display:none; flex-direction:column; align-items:center; justify-content:center; z-index:80; text-align:center;}
#resultOverlay.show, #gameoverOverlay.show{display:flex;}
.resultTitle{font-size:26px; font-weight:800; letter-spacing:2px; color:var(--accent);}
.resultTitle.go{color:var(--accent2);}
.resultStat{margin-top:18px; color:var(--sub); font-size:13px; letter-spacing:1px;}
.resultVal{font-size:22px; font-weight:700; color:var(--text); margin-top:2px;}
.resultBtns{display:flex; gap:12px; margin-top:30px;}
.resultBtns button{padding:12px 26px; border-radius:12px; border:1px solid var(--line); font-size:15px;}
.btnPrimary{background:var(--accent); color:var(--accent-ink); border:none; font-weight:700;}
.btnGhost{background:var(--panel); color:var(--text);}

/* TASKS */
.taskCard{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:14px;
  margin-bottom:10px; display:flex; justify-content:space-between; align-items:center;}
.taskName{font-size:14px;} .taskSub{font-size:12px; color:var(--sub); margin-top:4px;}
.claimBtn{background:var(--accent); color:var(--accent-ink); border:none; border-radius:10px; padding:9px 14px; font-size:13px; font-weight:700;}
.claimBtn:disabled{background:var(--panel2); color:var(--sub);}
.sectionTitle{font-size:13px; color:var(--sub); letter-spacing:2px; margin:18px 0 10px;}
.seasonInfo{font-size:12px; color:var(--sub); margin-bottom:12px;}
.rewardTrack{display:flex; flex-direction:column-reverse; gap:10px; margin-top:8px;}
.rewardRow{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:12px;
  display:flex; align-items:center; gap:12px;}
.rewardRow.locked{opacity:.45;}
.rewardEmoji{font-size:28px; width:40px; text-align:center;}
.rewardImg{height:40px; object-fit:contain; border-radius:8px; flex-shrink:0;}
.rewardText{flex:1;} .rewardThresh{font-size:11px; color:var(--sub);}

.pointsProgress{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:12px 14px;}
.pointsProgressTop{display:flex; align-items:baseline; justify-content:space-between;}
.pointsProgressLabel{font-size:12px; color:var(--sub); letter-spacing:1px;}
.pointsProgressVal{font-size:20px; font-weight:700; color:var(--text);}
.pointsProgressBarOuter{width:100%; height:10px; background:var(--panel2); border:1px solid var(--line);
  border-radius:8px; overflow:hidden; margin-top:10px;}
.pointsProgressBarInner{height:100%; width:0%; background:linear-gradient(90deg,var(--accent),#ffb84d);
  border-radius:8px; transition:width .35s ease;}
.pointsProgressNext{font-size:12px; color:var(--sub); margin-top:8px;}

/* DECOR PANEL */
.decoTabs{display:flex; gap:6px; overflow-x:auto; padding-bottom:8px;}
.decoTab{background:var(--panel); border:1px solid var(--line); color:var(--sub); padding:7px 14px;
  border-radius:20px; font-size:13px; white-space:nowrap;}
.decoTab.active{background:var(--accent); color:var(--accent-ink); border-color:var(--accent);}
.decoGrid{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-top:12px;}
.decoItem{background:var(--panel); border:1px solid var(--line); border-radius:12px; aspect-ratio:1;
  display:flex; align-items:center; justify-content:center; font-size:26px; overflow:hidden;}
.decoItem.locked{opacity:.3;}
.decoItemImg{width:78%; height:78%; object-fit:contain;}

/* SETTINGS */
.settingRow{display:flex; justify-content:space-between; align-items:center; padding:14px 0;
  border-bottom:1px solid var(--line);}
.settingRow label{font-size:14px;}
.settingRow input[type=range]{width:150px;}
.toggle{width:46px; height:26px; border-radius:14px; background:var(--panel2); position:relative; border:1px solid var(--line);}
.toggle.on{background:var(--accent);}
.toggle::after{content:''; position:absolute; width:20px; height:20px; border-radius:50%; background:#fff;
  top:2px; left:2px; transition:left .15s ease;}
.toggle.on::after{left:22px;}
.settingBtn{background:var(--panel); border:1px solid var(--line); color:var(--text); border-radius:10px;
  padding:10px 16px; font-size:13px; margin-top:8px; width:100%;}
.settingBtn:disabled{opacity:.5;}
.updateStatusText{font-size:12px; color:var(--sub); line-height:1.5; margin-top:6px; min-height:1.5em;}
.dangerBtn{color:var(--accent2); border-color:var(--accent2);}
#importFile{display:none;}
.confirmBox{position:fixed; inset:0; background:rgba(0,0,0,.7); display:none; align-items:center;
  justify-content:center; z-index:200;}
.confirmBox.show{display:flex;}
.confirmCard{background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:22px; width:80%; max-width:320px; text-align:center;}
.confirmCard p{font-size:14px; color:var(--sub); margin:10px 0 18px;}
.confirmBtns{display:flex; gap:10px;}
.confirmBtns button{flex:1; padding:11px; border-radius:10px; border:1px solid var(--line);}
.toast{position:fixed; bottom:calc(20px + var(--safe-b)); left:50%; transform:translateX(-50%);
  background:var(--panel); border:1px solid var(--line); padding:10px 18px; border-radius:20px;
  font-size:13px; z-index:300; opacity:0; transition:opacity .25s ease;}
.toast.show{opacity:1;}

/* MUSIC PANEL (mp3-player style card) */
.musicPanelOverlay{position:fixed; inset:0; background:rgba(20,14,6,.55); display:none;
  align-items:center; justify-content:center; z-index:260; padding:20px;}
.musicPanelOverlay.show{display:flex;}
.musicPanelCard{background:var(--panel); border-radius:20px; width:100%; max-width:340px;
  max-height:74vh; display:flex; flex-direction:column; overflow:hidden;
  box-shadow:0 14px 34px rgba(0,0,0,.3);}
.musicPanelHeader{display:flex; align-items:center; justify-content:space-between;
  padding:16px 16px 12px; border-bottom:1px solid var(--line); flex-shrink:0;}
.musicPanelHeader h3{margin:0; font-size:15px; font-weight:700; color:var(--text);}
.musicPanelClose{background:var(--panel2); border:none; color:var(--sub); width:28px; height:28px;
  border-radius:50%; font-size:13px; flex-shrink:0; touch-action:manipulation;}
.musicPanelList{overflow-y:auto; padding:10px 10px 4px; display:flex; flex-direction:column; gap:6px;}
.musicRow{display:flex; align-items:center; gap:10px; padding:9px 8px; border-radius:14px;
  background:transparent; touch-action:manipulation;}
.musicRow.active{background:var(--panel2);}
.musicRowIcon{position:relative; width:34px; height:34px; border-radius:50%; flex-shrink:0;
  background:
    radial-gradient(circle at 50% 50%, var(--accent) 0 5px, #161616 6px, #161616 100%),
    repeating-radial-gradient(circle at 50% 50%, #333 0px, #333 1px, #101010 1px, #101010 3px);
  box-shadow:0 2px 6px rgba(0,0,0,.25);}
.musicRowIcon::before{content:''; position:absolute; inset:0; border-radius:50%;
  background:conic-gradient(from -40deg,
    rgba(255,255,255,0) 0deg, rgba(255,255,255,.6) 18deg, rgba(255,255,255,0) 42deg,
    rgba(255,255,255,0) 190deg, rgba(255,255,255,.25) 208deg, rgba(255,255,255,0) 226deg,
    rgba(255,255,255,0) 360deg);
  mix-blend-mode:screen; pointer-events:none;}
.musicRowIcon.spinning{animation:spin 4s linear infinite;}
.musicRowInfo{flex:1; min-width:0;}
.musicRowName{font-size:13px; font-weight:600; color:var(--text); white-space:nowrap;
  overflow:hidden; text-overflow:ellipsis;}
.musicRowStatus{font-size:11px; color:var(--sub); margin-top:2px;}
.musicRowBtn{background:var(--panel); border:1px solid var(--line); color:var(--text);
  width:32px; height:32px; border-radius:50%; font-size:13px; flex-shrink:0;
  display:flex; align-items:center; justify-content:center; touch-action:manipulation;}
.musicRowBtn.isPlaying{background:var(--accent); color:var(--accent-ink); border-color:var(--accent);}
.musicPanelEmpty{padding:34px 20px; text-align:center; color:var(--sub); font-size:13px; line-height:1.6;}
.musicPanelFooter{padding:10px 16px calc(12px + var(--safe-b)); border-top:1px solid var(--line); flex-shrink:0;}
.musicPanelStopBtn{width:100%; background:var(--panel2); color:var(--sub); border:none;
  border-radius:12px; padding:10px; font-size:13px; font-weight:600; touch-action:manipulation;}
</style>
</head>
<body>
<div id="app">

  <!-- HOME -->
  <div class="screen active" id="homeScreen">
    <button class="homeEditBtn" id="homeEditBtn">✏️ 布置模式：關閉</button>
    <div id="homeCanvasFrame">
      <div id="homeCanvas">
        <div id="gramophone" title="音樂播放器"></div>
      </div>
    </div>
    <div id="decoToolbar">
      <div class="scaleCell"><span>大小</span><input type="range" id="scaleSlider" min="0.4" max="2.2" step="0.05" value="1"></div>
      <button data-act="rotR">↻ 旋轉</button>
      <button data-act="flip">↔️ 翻轉</button>
      <button data-act="del">🗑️ 刪除</button>
    </div>
    <div id="navBar">
      <button data-target="stageScreen"><span class="navIcon">⚔️</span>關卡</button>
      <button data-target="taskScreen"><span class="navIcon">📋</span>任務</button>
      <button data-target="decoScreen"><span class="navIcon">🎨</span>布置</button>
      <button data-target="settingScreen"><span class="navIcon">⚙️</span>設定</button>
    </div>
  </div>

  <!-- STAGE -->
  <div class="screen" id="stageScreen">

  const roundIdx = (STATE && STATE.season && typeof STATE.season.index==="number") ? STATE.season.index : 0;

  const def = idx>=0 ? BOSS_LIST[idx] : null;
  if(!def){

    return { id:"boss_fallback", name:"Boss", img:"", maxHp:CONFIG.boss.maxHp, attackIntervalMs:CONFIG.boss.attackIntervalMs };

/* =========================================================
   SAVE SYSTEM (IndexedDB)
========================================================= */
const DB_NAME="boss_tetris_db", DB_STORE="save", DB_KEY="state";
let dbInstance=null;
function openDB(){
  return new Promise((resolve,reject)=>{
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = ()=>{ req.result.createObjectStore(DB_STORE); };
    req.onsuccess = ()=>resolve(req.result);
    req.onerror = ()=>reject(req.error);
  });
}
async function dbGet(){
  try{
    if(!dbInstance) dbInstance = await openDB();
    return await new Promise((resolve,reject)=>{
      const tx = dbInstance.transaction(DB_STORE,"readonly");
      const req = tx.objectStore(DB_STORE).get(DB_KEY);
      req.onsuccess=()=>resolve(req.result||null);
      req.onerror=()=>reject(req.error);
    });
  }catch(e){ console.warn("dbGet failed",e); return null; }
}
async function dbSet(data){
  try{
    if(!dbInstance) dbInstance = await openDB();
    return await new Promise((resolve,reject)=>{
      const tx = dbInstance.transaction(DB_STORE,"readwrite");
      tx.objectStore(DB_STORE).put(data, DB_KEY);
      tx.oncomplete=()=>resolve(true);
      tx.onerror=()=>reject(tx.error);
    });
  }catch(e){ console.warn("dbSet failed",e); return false; }
}

function defaultState(){
  return {
    saveVersion: CONFIG.saveVersion,
    stamina: { current: CONFIG.stamina.max, lastTs: Date.now() },
    stats: { totalWins:0, bestTimeMs:null, bestCombo:0 },
    music: { unlocked:[], current:null, musicOn:true, musicVol:0.6, sfxVol:0.6 },
    daily: { date:null, played:false, cleared:false, claimPlay:false, claimClear:false },
    season: { index:null, points:0, wins:0, claimed:[false,false,false], rewardsClaimed:[] },
    unlockedItems: [],
    home: { background:null, placed:[] } // placed: {uid,itemId,x,y,scale,flipped,z}
  };
}
let STATE = null;
let saveTimer = null;
// 【修正 IndexedDB 存檔競態】Serial Save Queue：
// 所有實際要寫進 IndexedDB 的動作，一律串接在同一條 saveQueueTail 上依序執行，
// 不會同時競速——就算某一次 dbSet() 比較晚 resolve，實際寫入 IndexedDB 的順序仍然
// 完全依照排隊的先後順序（A→B→C→D 送進去，即使非同步完成順序被打亂，最終寫入
// IndexedDB 的操作順序也一定是 A→B→C→D，最後留在資料庫裡的一定是 D）。
// dbSet() 本身已經用 try/catch 保證不會 reject（失敗回傳 false），這裡再用 .catch() 補一層保險，
// 確保單一次寫入失敗（例如中途發生 tx.onerror）絕對不會讓 chain 中斷、拖累後面排隊中的寫入。
let saveQueueTail = Promise.resolve(true);
function enqueueSave(snapshot){
  const task = saveQueueTail.then(()=> dbSet(snapshot)).catch(()=> false);
  saveQueueTail = task;
  return task;
}
function scheduleSave(){
  if(saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{
    saveTimer = null;
    // 在 timer 真正觸發的當下立刻做 deep snapshot，而不是等排到 queue 裡才讀 STATE，
    // 避免「開始非同步寫入後 STATE 又被修改」導致原本準備保存的資料被後續變動污染。
    enqueueSave(JSON.parse(JSON.stringify(STATE)));
  }, 150);
}
// 可靠版寫入：確保「目前為止所有已經排入 queue 的存檔」都真的完整寫入 IndexedDB 才 resolve。
// saveQueueTail 是一條依序串接的 Promise chain，await 它就等同於等待整條 queue 清空，
// 而不是只等最後一次呼叫留下的單一 Promise reference。
async function flushSave(){
  if(saveTimer){
    clearTimeout(saveTimer);
    saveTimer = null;
    enqueueSave(JSON.parse(JSON.stringify(STATE)));
  }
  return await saveQueueTail;
}
async function loadState(){
  const raw = await dbGet();
  if(raw && raw.saveVersion){
    STATE = migrate(raw);
  } else {
    STATE = defaultState();
  }
  reconcileStamina();
  reconcileDaily();
  reconcileSeason();
  scheduleSave();
}
function migrate(raw){
  // future migrations go here based on raw.saveVersion
  const base = defaultState();
  const merged = Object.assign(base, raw, {
    stamina: Object.assign(base.stamina, raw.stamina),
    stats: Object.assign(base.stats, raw.stats),
    music: Object.assign(base.music, raw.music),
    daily: Object.assign(base.daily, raw.daily),
    season: Object.assign(base.season, raw.season),
    home: Object.assign(base.home, raw.home)
  });
  // 保險去重：賽季模板每輪循環使用相同的物件/背景/音樂id，
  // 正常流程已用 includes 判斷避免重複塞入，這裡對讀出來的舊存檔再做一次去重，
  // 確保就算是更舊版本產生的存檔，也不會因重複資料造成顯示或領取異常
  merged.unlockedItems = Array.from(new Set(merged.unlockedItems||[]));
  merged.music.unlocked = Array.from(new Set(merged.music.unlocked||[]));
  merged.season.rewardsClaimed = Array.from(new Set(merged.season.rewardsClaimed||[]));
  return merged;
}

/* =========================================================
   TIME HELPERS
========================================================= */
function localDateKey(d){
  // 每日任務以「早上8點」為一天的分界，而非午夜0點：
  // 把時間往回推 dailyResetHour 小時再取日期，換算後的日期一改變，
  // 就代表已經跨過當天的重置時刻（早上8:00）
  const shifted = new Date(d.getTime() - CONFIG.dailyResetHour*3600*1000);
  return shifted.getFullYear()+"-"+(shifted.getMonth()+1)+"-"+shifted.getDate();
}
function seasonAnchorTs(){
  const a=CONFIG.seasonAnchor;
  return new Date(a.year,a.month,a.day,a.hour,0,0,0).getTime();
}
function currentSeasonIndex(now){
  const periodMs = CONFIG.seasonLengthDays*24*3600*1000;
  return Math.floor((now - seasonAnchorTs())/periodMs);
}
function seasonStartTs(idx){
  const periodMs = CONFIG.seasonLengthDays*24*3600*1000;
  return seasonAnchorTs() + idx*periodMs;
}

function reconcileStamina(){
  const now=Date.now();
  const cfg=CONFIG.stamina;
  if(STATE.stamina.current < cfg.max){
    const elapsed = now - STATE.stamina.lastTs;
    const gained = Math.floor(elapsed/cfg.regenMs);
    if(gained>0){
      STATE.stamina.current = Math.min(cfg.max, STATE.stamina.current+gained);
      STATE.stamina.lastTs += gained*cfg.regenMs;
    }
  } else {
    STATE.stamina.lastTs = now;
  }
}
function reconcileDaily(){
  const key = localDateKey(new Date());
  if(STATE.daily.date !== key){
    STATE.daily = { date:key, played:false, cleared:false, claimPlay:false, claimClear:false };
  }
}
function reconcileSeason(){
  const idx = currentSeasonIndex(Date.now());
  if(STATE.season.index !== idx){
    STATE.season = { index: idx, points:0, wins:0, claimed:[false,false,false], rewardsClaimed:[] };
  }
}

/* =========================================================
   AUDIO SYSTEM (persistent across all UI renders)
========================================================= */
const AudioSys = (function(){
  let ctx=null, master=null, sfxGain=null;
  let currentTrackId=null;
  // 音樂使用單一個持久化的 <audio> 元素播放（來源是 MUSIC_TRACKS 裡的 url）。
  // 這個元素在整個網頁生命週期只建立一次，之後切換畫面/開關任何面板都只是
  // CSS 顯示/隱藏，不會重新建立或重新 play()，所以音樂不會從頭重播。
  let musicEl=null;
  function ensureCtx(){
    if(ctx) return;
    ctx = new (window.AudioContext||window.webkitAudioContext)();
    master = ctx.createGain(); master.connect(ctx.destination);
    sfxGain = ctx.createGain(); sfxGain.connect(master);
    applyVolumes();
  }
  function ensureMusicEl(){
    if(musicEl) return musicEl;
    musicEl = new Audio();
    musicEl.loop = true;
    musicEl.preload = "auto";
    musicEl.addEventListener("error", ()=>{ toast("音樂載入失敗，請確認網址是否正確"); });
    applyVolumes();
    return musicEl;
  }
  function applyVolumes(){
    if(ctx && sfxGain) sfxGain.gain.value = STATE.music.sfxVol;
    if(musicEl) musicEl.volume = STATE.music.musicOn ? STATE.music.musicVol : 0;
  }
  function playTrack(id){
    const track = MUSIC_TRACKS[id];
    if(!track || !track.url){ toast("此音樂尚未設定網址"); return; }
    ensureMusicEl();
    if(currentTrackId===id){
      // 同一首歌：若因瀏覽器自動播放限制而暫停了，續播即可，不重置進度
      if(musicEl.paused) musicEl.play().catch(()=>{});
      return;
    }
    currentTrackId = id;
    musicEl.src = track.url;
    musicEl.currentTime = 0;
    applyVolumes();
    musicEl.play().catch(()=>{ /* 可能需要使用者手勢才能播放，交由 unlockOnGesture 補播 */ });
  }
  function stop(){
    if(musicEl) musicEl.pause();
    currentTrackId=null;
  }
  function pause(){
    if(musicEl) musicEl.pause();
  }
  function setMusicOn(on){ STATE.music.musicOn = on; applyVolumes(); }
  function setMusicVol(v){ STATE.music.musicVol = v; applyVolumes(); }
  function setSfxVol(v){ STATE.music.sfxVol = v; applyVolumes(); }
  function sfx(type){
    ensureCtx(); if(ctx.state==="suspended") ctx.resume();
    const o=ctx.createOscillator(); const g=ctx.createGain();
    const t=ctx.currentTime;
    let f0=440,f1=440,dur=0.12;
    if(type==="clear"){f0=520;f1=880;dur=0.18;}
    if(type==="bomb"){f0=180;f1=60;dur=0.25;}
    if(type==="lock"){f0=220;f1=180;dur=0.08;}
    if(type==="victory"){f0=440;f1=880;dur=0.6;}
    if(type==="gameover"){f0=300;f1=80;dur=0.6;}
    o.frequency.setValueAtTime(f0,t); o.frequency.exponentialRampToValueAtTime(Math.max(f1,20),t+dur);
    g.gain.setValueAtTime(0.25,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(sfxGain); o.start(t); o.stop(t+dur+0.02);
  }
  function unlockOnGesture(){
    ensureCtx();
    if(ctx.state==="suspended") ctx.resume();
    if(STATE.music.current && STATE.music.unlocked.includes(STATE.music.current)){
      if(currentTrackId===null){
        playTrack(STATE.music.current);
      } else if(musicEl && musicEl.paused){
        musicEl.play().catch(()=>{});
      }
    }
  }
  return { playTrack, stop, pause, setMusicOn, setMusicVol, setSfxVol, sfx, applyVolumes, unlockOnGesture,
    get isPlaying(){ return !!(musicEl && !musicEl.paused && !musicEl.ended); } };
})();

function clampToCanvas(x,y){
  const w = homeCanvas.clientWidth || 320, h = homeCanvas.clientHeight || 400;
  const margin = 16;
  return [ Math.max(-margin, Math.min(w-margin, x)), Math.max(-margin, Math.min(h-margin, y)) ];
}
function bindDecoDrag(el,p){
  let dragging=false, sx=0, sy=0, ox=0, oy=0;
  el.addEventListener("pointerdown",(e)=>{
    if(!editMode) return;
    e.preventDefault();
    dragging=true; sx=e.clientX; sy=e.clientY; ox=p.x; oy=p.y;
    try{ el.setPointerCapture(e.pointerId); }catch(err){}
    selectDeco(p.uid);
  });
  el.addEventListener("pointermove",(e)=>{
    if(!dragging) return;
    const [cx,cy] = clampToCanvas(ox+(e.clientX-sx), oy+(e.clientY-sy));
    p.x = cx; p.y = cy;
    el.style.left=p.x+"px"; el.style.top=p.y+"px";
    positionToolbar(el);
  });
  function end(){ if(dragging){ dragging=false; scheduleSave(); } }
  el.addEventListener("pointerup",end);
  el.addEventListener("pointercancel",end);
  el.addEventListener("click",()=>{ if(editMode) selectDeco(p.uid); });
}
function selectDeco(uid){
  selectedUid = uid;
  $all(".deco").forEach(el=>el.classList.toggle("selected", el.dataset.uid===uid));
  if(uid){
    const el = homeCanvas.querySelector(`.deco[data-uid="${uid}"]`);
    if(el){ positionToolbar(el); decoToolbar.style.display="grid"; }
  } else {

}
function positionToolbar(el){
  const r = el.getBoundingClientRect(); const cr = homeCanvas.getBoundingClientRect();
  const wasHidden = decoToolbar.style.display !== "grid";
  if(wasHidden){ decoToolbar.style.visibility="hidden"; decoToolbar.style.display="grid"; }
  const toolbarW = decoToolbar.offsetWidth || 160;
  if(wasHidden){ decoToolbar.style.display="none"; decoToolbar.style.visibility=""; }
  decoToolbar.style.left = Math.max(4,Math.min(cr.width-toolbarW-4,r.left-cr.left)) + "px";
  decoToolbar.style.top = Math.max(4,r.top-cr.top-46) + "px";
}

/* =========================================================
   TETRIS ENGINE
========================================================= */
const COLS=10, ROWS=20;
let board, bag=[], nextQueue=[], current=null, cumulativeLines=0, combo=0, maxCombo=0;
let gravityTimer=null, lockTimer=null, lockResets=0;

function newBoard(){ return Array.from({length:ROWS},()=>Array(COLS).fill(null)); }
function refillBag(){
  const b = PIECE_TYPES.slice();
  for(let i=b.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]]; }
  bag.push(...b);
}
function drawFromBag(){ if(bag.length===0) refillBag(); return bag.shift(); }
function ensureQueue(){ while(nextQueue.length<2) nextQueue.push(drawFromBag()); }
function spawnPiece(type){ return { type, rot:0, x:3, y:-1 }; }
function cellsOf(piece){
  const shape = SHAPES[piece.type][piece.rot];
  const cells=[];
  for(let r=0;r<4;r++) for(let c=0;c<4;c++) if(shape[r][c]==="X") cells.push([piece.x+c, piece.y+r]);
  return cells;
}
function collides(piece){
  for(const [x,y] of cellsOf(piece)){
    if(x<0||x>=COLS||y>=ROWS) return true;
    if(y>=0 && board[y][x]) return true;
  }
  return false;
}
function canMoveDown(piece){ const t={...piece,y:piece.y+1}; return !collides(t); }
function startLockTimer(){
  clearTimeout(lockTimer);
  lockTimer = setTimeout(()=>{ lockPiece(); }, CONFIG.lockDelayMs);
}
function clearLockTimer(){ if(lockTimer){ clearTimeout(lockTimer); lockTimer=null; } lockResets=0; }

function tryMove(dx,dy){
  if(!current || battleState.status!=="PLAYING" || battleState.paused) return false;
  const t={...current,x:current.x+dx,y:current.y+dy};
  if(collides(t)) return false;
  current=t;
  if(!canMoveDown(current)){ if(lockTimer && lockResets<CONFIG.lockMaxResets){ lockResets++; startLockTimer(); } else if(!lockTimer) startLockTimer(); }
  else clearLockTimer();
  renderPieceOverlay();
  return true;
}
function tryRotate(){
  if(!current || battleState.status!=="PLAYING" || battleState.paused) return;
  const t={...current, rot:(current.rot+1)%4};
  const kicks=[0,-1,1,-2,2];
  for(const k of kicks){
    const tk={...t,x:t.x+k};
    if(!collides(tk)){
      current=tk;
      if(!canMoveDown(current)){ if(lockTimer && lockResets<CONFIG.lockMaxResets){ lockResets++; startLockTimer(); } else if(!lockTimer) startLockTimer(); }
      else clearLockTimer();
      renderPieceOverlay(); return;
    }
  }
}
function hardDrop(){
  if(!current || battleState.status!=="PLAYING" || battleState.paused) return;
  let t={...current};
  while(!collides({...t,y:t.y+1})) t.y++;
  current=t;
  clearLockTimer();
  lockPiece();
}
function gravityTick(){
  if(!current || battleState.status!=="PLAYING" || battleState.paused) return;
  if(canMoveDown(current)){ current={...current,y:current.y+1}; clearLockTimer(); renderPieceOverlay(); }
  else { if(!lockTimer) startLockTimer(); }
}

function lockPiece(){
  if(!current) return;
  clearLockTimer();
  for(const [x,y] of cellsOf(current)){
    if(y>=0 && y<ROWS && x>=0 && x<COLS) board[y][x]={t:current.type};
  }
  AudioSys.sfx("lock");
  const bombHit = checkBombTouch(current);
  current=null;
  if(bombHit!==null) explodeBombRow(bombHit);
  const cleared = clearFullLines();
  if(cleared>0){
    combo++; maxCombo=Math.max(maxCombo,combo);
    cumulativeLines += cleared;
    applyDamage(cleared, combo);
    AudioSys.sfx("clear");
  } else {
    combo=0;
  }
  renderStaticBoard();
  if(battleState.status==="PLAYING") spawnNext();
}
function checkBombTouch(piece){
  for(const [x,y] of cellsOf(piece)){
    const dirs=[[0,1],[0,-1],[1,0],[-1,0]];
    for(const [dx,dy] of dirs){
      const ny=y+dy, nx=x+dx;
      if(ny>=0&&ny<ROWS&&nx>=0&&nx<COLS && board[ny][nx] && board[ny][nx].bomb) return ny;
    }
  }
  return null;
}
function explodeBombRow(rowIdx){
  AudioSys.sfx("bomb");
  board.splice(rowIdx,1);
  board.unshift(Array(COLS).fill(null));
}
function clearFullLines(){
  let cleared=0;
  for(let y=ROWS-1;y>=0;y--){
    const row=board[y];
    const full = row.every(c=>c!==null);
    const hasPlayerCell = row.some(c=>c && !c.garbage && !c.bomb);
    if(full && hasPlayerCell){
      board.splice(y,1); board.unshift(Array(COLS).fill(null));
      cleared++; y++;
    }
  }
  return cleared;
}
function applyDamage(lines,comboVal){
  const base = CONFIG.damage[Math.min(lines,4)] || 0;
  const mult = Math.min(1 + CONFIG.comboStepPct*(comboVal-1), CONFIG.comboMaxMult);
  let dmg = Math.floor(base*mult);
  let newHp = battleState.bossHp - dmg;
  if(cumulativeLines < CONFIG.minLinesBeforeKill){ newHp = Math.max(newHp, 1); }
  battleState.bossHp = Math.max(0, newHp);
  renderBossHp();
  if(battleState.bossHp<=0){ endBattle(true); }
}
function spawnNext(){
  ensureQueue();
  const type = nextQueue.shift();
  ensureQueue();
  current = spawnPiece(type);
  if(collides(current)){ endBattle(false); return; }
  renderPieceOverlay();
  renderNext();
}

function pushGarbageRows(n){
  // Tetris Battle 規則：boss 每次攻擊新增的一排「垃圾列」中，
  // 只會有「一個」隨機位置的炸彈方塊，其餘皆為一般垃圾方塊（不可單獨用疊滿整排消除，
  // 需靠玩家消行往上頂，或讓下落的方塊「壓到」炸彈方塊，觸發整排一次清除）。
  for(let i=0;i<n;i++){
    board.shift();
    const bombCol = Math.floor(Math.random()*COLS);
    const row = Array.from({length:COLS},(_,x)=>
      x===bombCol ? {t:"bomb",bomb:true} : {t:"garbage",garbage:true}
    );
    board.push(row);
  }
  renderStaticBoard();
  if(current){
    current = {...current, y: current.y - n};
    if(collides(current)){ endBattle(false); return; }
  }
  renderPieceOverlay();
}

/* =========================================================
   RENDER: BOARD / NEXT
   (static board cells and the falling piece overlay are rendered
   separately so moving/rotating only touches a handful of DOM
   nodes instead of the whole 200-cell grid every tick)
========================================================= */
let boardCells=[];
let lastPieceCells=[];
let lastGhostCells=[];
function buildBoardDom(){
  const boardEl=$("#board"); boardEl.innerHTML="";
  boardCells=[]; lastPieceCells=[]; lastGhostCells=[];
  for(let y=0;y<ROWS;y++){
    const rowArr=[];
    for(let x=0;x<COLS;x++){
      const d=document.createElement("div"); d.className="cell"; boardEl.appendChild(d); rowArr.push(d);
    }
    boardCells.push(rowArr);
  }
  sizeBoard();
  renderStaticBoard();
}
function sizeBoard(){
  const wrap = $("#boardWrap"); const boardEl=$("#board");
  if(!wrap || !boardEl) return;
  const availW = wrap.clientWidth - 4;
  const availH = wrap.clientHeight - 4;
  if(availW<=0 || availH<=0) return;
  let cell = Math.floor(Math.min(availW/COLS, availH/ROWS));
  cell = Math.max(10, cell);
  boardEl.style.width = (cell*COLS)+"px";
  boardEl.style.height = (cell*ROWS)+"px";
}
let resizeDebounce=null;
window.addEventListener("resize", ()=>{
  clearTimeout(resizeDebounce);
  resizeDebounce=setTimeout(()=>{ if(document.getElementById("battleScreen").classList.contains("active")) sizeBoard(); }, 120);
});
function renderStaticBoard(){
  for(let y=0;y<ROWS;y++){
    for(let x=0;x<COLS;x++){
      const cell=board[y][x];
      let cls="cell";
      if(cell){ cls += cell.bomb ? " piece-bomb" : cell.garbage ? " piece-garbage" : " piece-"+cell.t; }
      boardCells[y][x].className=cls;
    }
  }
  lastPieceCells=[];
  lastGhostCells=[];
}
function ghostPieceFor(piece){
  let t={...piece};
  while(!collides({...t,y:t.y+1})) t.y++;
  return t;
}
function renderPieceOverlay(){
  for(const [x,y] of lastPieceCells){
    if(y>=0 && y<ROWS && x>=0 && x<COLS) boardCells[y][x].className="cell";
  }
  for(const [x,y] of lastGhostCells){
    if(y>=0 && y<ROWS && x>=0 && x<COLS) boardCells[y][x].className="cell";
  }
  lastPieceCells=[];
  lastGhostCells=[];
  if(current){
    const pieceCells = cellsOf(current);
    const pieceKeySet = new Set(pieceCells.map(([x,y])=>x+","+y));
    const ghost = ghostPieceFor(current);
    for(const [x,y] of cellsOf(ghost)){
      if(y>=0 && y<ROWS && x>=0 && x<COLS && !pieceKeySet.has(x+","+y)){
        boardCells[y][x].className="cell piece-"+current.type+" ghost";
        lastGhostCells.push([x,y]);
      }
    }
    for(const [x,y] of pieceCells){
      if(y>=0 && y<ROWS && x>=0 && x<COLS){
        boardCells[y][x].className="cell piece-"+current.type;
        lastPieceCells.push([x,y]);
      }
    }
  }
}
function renderMiniBox(el,type){
  el.innerHTML="";
  const shape = type ? SHAPES[type][0] : null;
  for(let r=0;r<4;r++) for(let c=0;c<4;c++){
    const d=document.createElement("div");
    d.className="cell"+((shape&&shape[r][c]==="X")?(" piece-"+type):"");
    el.appendChild(d);
  }
}
function renderNext(){
  ensureQueue();
  renderMiniBox($("#nextBox1"), nextQueue[0]);
  renderMiniBox($("#nextBox2"), nextQueue[1]);
}
function renderBossHp(){
  const pct = Math.max(0, battleState.bossHp/battleState.bossMaxHp*100);
  const bar=$("#battleHpBar");
  bar.style.width = pct+"%";
  bar.style.background = pct<25 ? "linear-gradient(90deg,var(--hp-low),#c33)" :
    pct<55 ? "linear-gradient(90deg,var(--hp-mid),#c98)" : "linear-gradient(90deg,var(--hp-full),#3fcbb0)";
  $("#stageHpBar").style.width = "100%";
}

/* =========================================================
   BOSS SYSTEM / BATTLE LIFECYCLE
========================================================= */
// 只計算「有效遊玩時間」用的時鐘來源：優先用 performance.now()（同一頁面內單調遞增、不受系統時間調整影響），
// 沒有的環境才退回 Date.now()。這個時鐘只用來算 Clear Time，不影響任何 Battle gameplay。
function nowPerf(){
  return (typeof performance !== "undefined" && typeof performance.now === "function") ? performance.now() : Date.now();
}
const battleState = { status:"IDLE", paused:false, bossHp:CONFIG.boss.maxHp, bossMaxHp:CONFIG.boss.maxHp, bossAttackIntervalMs:CONFIG.boss.attackIntervalMs, attackTimer:null, activeStartTs:0, activeElapsedMs:0, elapsedMs:0, autoPausedByVisibility:false };
let bossAnimClone=null, bossAnimTimeouts=[];

function startBattle(){
  // 「關卡畫面看到的 Boss」與「進入戰鬥後的 Boss」必須完全一致，
  // 兩邊都一律呼叫 getCurrentBoss() 取得同一份資料，不再各自寫死。
  const boss = getCurrentBoss();
  board=newBoard(); bag=[]; nextQueue=[]; current=null;
  cumulativeLines=0; combo=0; maxCombo=0;
  battleState.status="PLAYING"; battleState.paused=false;
  battleState.bossMaxHp=boss.maxHp; battleState.bossHp=boss.maxHp;
  battleState.bossAttackIntervalMs=boss.attackIntervalMs;
  battleState.activeElapsedMs=0; battleState.activeStartTs=nowPerf(); battleState.elapsedMs=0;
  battleState.autoPausedByVisibility=false; // 避免延續上一場戰鬥殘留的 flag，造成新戰鬥一開始就誤判成「因背景被自動暫停」
  $("#bossImgBattle").src = boss.img;
  $("#bossImgBattle").alt = boss.name;
  buildBoardDom();
  renderBossHp();
  $("#resultOverlay").classList.remove("show");
  $("#gameoverOverlay").classList.remove("show");
  showScreen("battleScreen");
  document.getElementById("battleScreen").classList.add("active");
  sizeBoard();
  spawnNext();
  resumeBattleLoop();
  scheduleBossAttack();
  STATE.daily.played = true; scheduleSave();
}
// 【修正 Clear Time】resume 只在「真的從 paused 狀態恢復」時才重設 activeStartTs，
// 避免重複呼叫 resumeBattleLoop()（例如 startBattle 內第一次呼叫）造成時間基準被誤重設。
function resumeBattleLoop(){
  if(battleState.paused && battleState.status==="PLAYING"){
    battleState.activeStartTs = nowPerf();
  }
  battleState.paused = false;
  if(gravityTimer) clearInterval(gravityTimer);
  if(battleState.status==="PLAYING") gravityTimer = setInterval(gravityTick, CONFIG.gravityMs);
}
// 【修正 Clear Time】只在「從未暫停→暫停」的那個瞬間才把這段 active 時間累加進 activeElapsedMs，
// 之後不管是 Boss pause 還是背景切換造成的 pause，重複呼叫都不會重複累加（idempotent）。
function pauseBattleLoop(){
  if(!battleState.paused && battleState.status==="PLAYING"){
    battleState.activeElapsedMs += nowPerf() - battleState.activeStartTs;
  }
  battleState.paused = true;
  if(gravityTimer){ clearInterval(gravityTimer); gravityTimer=null; }
  clearLockTimer();
}
function scheduleBossAttack(){
  clearBossAttackTimer();
  battleState.attackTimer = setTimeout(bossAttack, battleState.bossAttackIntervalMs);
}
function clearBossAttackTimer(){
  if(battleState.attackTimer){ clearTimeout(battleState.attackTimer); battleState.attackTimer=null; }
}
function bossAttack(){
  if(battleState.status!=="PLAYING") return;
  pauseBattleLoop();
  playBossSkillAnimation(()=>{
    if(battleState.status==="PLAYING") pushGarbageRows(CONFIG.garbage.rowsPerAttack);
    if(battleState.status==="PLAYING"){ resumeBattleLoop(); scheduleBossAttack(); }
  });
}
function playBossSkillAnimation(done){
  const orig = $("#bossImgBattle");
  const overlay = $("#battlePauseOverlay");
  if(!orig){ done(); return; }
  const rect = orig.getBoundingClientRect();
  const appRect = $("#app").getBoundingClientRect();
  overlay.style.opacity="1"; overlay.style.pointerEvents="auto";
  const clone = document.createElement("img");
  clone.src = orig.src; clone.id="bossAnimClone";
  Object.assign(clone.style,{
    position:"fixed", left:rect.left+"px", top:rect.top+"px",
    width:rect.width+"px", height:rect.height+"px", objectFit:"contain",
    zIndex:500, pointerEvents:"none",
    transition:"left .35s ease, top .35s ease, width .35s ease, height .35s ease"
  });
  document.body.appendChild(clone);
  orig.style.visibility="hidden";
  bossAnimClone = clone;
  requestAnimationFrame(()=>{
    const size = Math.min(appRect.width*0.62, 260);
    const left = appRect.left + (appRect.width-size)/2;
    const top = appRect.top + (appRect.height-size)/2 - 30;
    clone.style.left=left+"px"; clone.style.top=top+"px";
    clone.style.width=size+"px"; clone.style.height=size+"px";
  });
  bossAnimTimeouts.push(setTimeout(()=>{
    clone.classList.add("shakeBoss");
    bossAnimTimeouts.push(setTimeout(()=>{
      clone.classList.remove("shakeBoss");
      clone.style.left=rect.left+"px"; clone.style.top=rect.top+"px";
      clone.style.width=rect.width+"px"; clone.style.height=rect.height+"px";
      bossAnimTimeouts.push(setTimeout(()=>{
        overlay.style.opacity="0"; overlay.style.pointerEvents="none";
        cleanupBossAnim();
        done();
      }, 380));
    }, 480));
  }, 380));
}
function cleanupBossAnim(){
  if(bossAnimClone){ bossAnimClone.remove(); bossAnimClone=null; }
  const orig = $("#bossImgBattle"); if(orig) orig.style.visibility="visible";
  bossAnimTimeouts.forEach(clearTimeout); bossAnimTimeouts=[];
  const overlay=$("#battlePauseOverlay");
  if(overlay){ overlay.style.opacity="0"; overlay.style.pointerEvents="none"; }
}
function stopAllBattleTimers(){
  if(gravityTimer){ clearInterval(gravityTimer); gravityTimer=null; }
  clearLockTimer();
  clearBossAttackTimer();
  cleanupBossAnim();
  battleState.paused=false;
}
document.addEventListener("visibilitychange",()=>{
  if(document.hidden){
    if(battleState.status==="PLAYING" && !battleState.paused){ pauseBattleLoop(); battleState.autoPausedByVisibility=true; }
  } else {
    if(battleState.autoPausedByVisibility){ battleState.autoPausedByVisibility=false; if(battleState.status==="PLAYING") resumeBattleLoop(); }
  }
});
function endBattle(victory){
  if(battleState.status!=="PLAYING") return;
  // 【修正 Clear Time】結束當下如果還沒 paused，代表最後這一段 active 時間還沒被計入，
  // 必須在切換 status（讓後續 visibilitychange 等判斷失效）之前先補上，否則會少算最後一段。
  if(!battleState.paused){
    battleState.activeElapsedMs += nowPerf() - battleState.activeStartTs;
  }
  battleState.status = victory ? "VICTORY" : "GAME_OVER";
  stopAllBattleTimers();
  battleState.elapsedMs = battleState.activeElapsedMs;
  if(victory){
    AudioSys.sfx("victory");
    STATE.stats.totalWins++;
    if(!STATE.stats.bestTimeMs || battleState.elapsedMs<STATE.stats.bestTimeMs) STATE.stats.bestTimeMs=battleState.elapsedMs;
    STATE.stats.bestCombo=Math.max(STATE.stats.bestCombo,maxCombo);
    STATE.daily.cleared = true;
    STATE.season.wins += 1;
    scheduleSave();
    showResult();
  } else {
    AudioSys.sfx("gameover");
    $("#gameoverOverlay").classList.add("show");
  }
}
function fmtTime(ms){
  // 【修正邊界問題】先把總時間四捨五入到「0.1 秒」為單位的整數，再從這個已經進位過的
  // 總數換算分鐘/秒/十分位，避免像 59.96 秒被 toFixed(1) 單獨進位成 "60.0" 卻沒有連動進位到分鐘，
  // 產生不合法的 00:60.0。
  const totalTenths = Math.max(0, Math.round(ms/100));
  const m = Math.floor(totalTenths/600);
  const remTenths = totalTenths - m*600;
  const s = Math.floor(remTenths/10);
  const tenths = remTenths%10;
  return String(m).padStart(2,"0")+":"+String(s).padStart(2,"0")+"."+tenths;
}

function bindHoldRepeat(btn, onTap, {delay=CONFIG.dasDelayMs, repeat=CONFIG.dasRepeatMs}={}){
  let pid=null, repeatTimer=null, delayTimer=null;
  function clearTimers(){ clearTimeout(delayTimer); clearInterval(repeatTimer); delayTimer=null; repeatTimer=null; }
  btn.addEventListener("pointerdown",(e)=>{
    e.preventDefault();
    if(pid!==null) return;
    pid=e.pointerId; btn.setPointerCapture(pid);
    onTap();
    delayTimer=setTimeout(()=>{ repeatTimer=setInterval(onTap, repeat); }, delay);
  });
  function release(e){
    if(e && e.pointerId!==pid) return;
    pid=null; clearTimers();
  }
  btn.addEventListener("pointerup",release);
  btn.addEventListener("pointercancel",release);
  btn.addEventListener("pointerleave",release);
}
bindHoldRepeat($("#btnLeft"), ()=>tryMove(-1,0));
bindHoldRepeat($("#btnRight"), ()=>tryMove(1,0));
$("#btnRotate").addEventListener("pointerdown",(e)=>{ e.preventDefault(); tryRotate(); });

(function bindDropButton(){
  const btn=$("#btnDrop");
  let pid=null, mode="undetermined", holdTimer=null, softTimer=null;
  btn.addEventListener("pointerdown",(e)=>{
    e.preventDefault();
    if(pid!==null) return;
    pid=e.pointerId; btn.setPointerCapture(pid); mode="undetermined";
    holdTimer=setTimeout(()=>{
      mode="soft";
      softTimer=setInterval(()=>{ tryMove(0,1); }, CONFIG.softDropMs);
    }, CONFIG.dropHoldThresholdMs);
  });
  function release(e){
    if(e && e.pointerId!==pid) return;
    clearTimeout(holdTimer); clearInterval(softTimer); holdTimer=null; softTimer=null;
    if(mode==="undetermined"){ hardDrop(); }
    pid=null; mode="undetermined";
  }
  btn.addEventListener("pointerup",release);
  btn.addEventListener("pointercancel",release);
  btn.addEventListener("pointerleave",release);
})();

document.addEventListener("keydown",(e)=>{

function renderTasks(){
  reconcileDaily(); reconcileSeason(); scheduleSave();
  const dailyEl=$("#dailyTasks"); dailyEl.innerHTML="";
  dailyEl.appendChild(taskCard("挑戰一次", STATE.daily.played, STATE.daily.claimPlay, ()=>claimDaily("play")));
  dailyEl.appendChild(taskCard("通關一次", STATE.daily.cleared, STATE.daily.claimClear, ()=>claimDaily("clear")));

  const startD = new Date(seasonStartTs(STATE.season.index));
  const endD = new Date(seasonStartTs(STATE.season.index+1));
  $("#seasonInfo").textContent = `本賽季：${fmtDate(startD)} ～ ${fmtDate(endD)}`;

  const chEl=$("#challengeTasks"); chEl.innerHTML="";
  CONFIG.challengeGoals.forEach((goal,i)=>{
    const done = STATE.season.wins>=goal;
    chEl.appendChild(taskCard(`勝利 ${goal} 次 (${Math.min(STATE.season.wins,goal)}/${goal})`, done, STATE.season.claimed[i], ()=>claimChallenge(i)));
  });

  const track=$("#rewardTrack"); track.innerHTML="";
  const rewards = getSeasonRewards(STATE.season.index);
  const points = STATE.season.points;
  const maxThreshold = rewards.length ? rewards[rewards.length-1].threshold : 0;

  $("#pointsCurrentVal").textContent = points;
  $("#pointsProgressBarInner").style.width = (maxThreshold>0 ? Math.min(100, points/maxThreshold*100) : 100) + "%";
  const nextReward = rewards.find(r=> points < r.threshold);
  $("#pointsProgressNext").textContent = nextReward
    ? `距離「${nextReward.name}」還差 ${nextReward.threshold - points} 積分`
    : "已達成本賽季所有積分獎勵！";

  rewards.forEach(r=>{
    const unlocked = points >= r.threshold;
    const claimed = STATE.season.rewardsClaimed.includes(r.id+":"+STATE.season.index);
    const row=document.createElement("div");
    row.className="rewardRow"+(unlocked?"":" locked");
    const threshText = unlocked
      ? (claimed ? "已領取" : "已達成，可領取")
      : `還差 ${r.threshold - points} 積分（需要 ${r.threshold} 積分）`;
    const iconHtml = r.img
      ? `<img class="rewardEmoji rewardImg" src="${r.img}" alt="${r.name}">`
      : `<div class="rewardEmoji">${r.emoji}</div>`;
    row.innerHTML = `${iconHtml}
      <div class="rewardText"><div>${r.name}</div><div class="rewardThresh">${threshText}</div></div>`;
    const btn=document.createElement("button");
    btn.className="claimBtn";
    btn.textContent = claimed ? "已領取" : "領取";
    btn.disabled = !unlocked || claimed;
    btn.addEventListener("click",()=>claimReward(r));
    row.appendChild(btn);
    track.appendChild(row);
  });
}
function fmtDate(d){ return `${d.getMonth()+1}/${d.getDate()}`; }
function taskCard(name,done,claimed,onClaim){
  const el=document.createElement("div"); el.className="taskCard";
  el.innerHTML = `<div><div class="taskName">${name}</div><div class="taskSub">${claimed?"已領取":done?"已完成":"進行中"}</div></div>`;
  const btn=document.createElement("button"); btn.className="claimBtn";
  btn.textContent = `領取 ${CONFIG.dailyTaskPoints} 積分`;
  btn.disabled = !done || claimed;
  btn.addEventListener("click",onClaim);
  el.appendChild(btn);
  return el;
}
function claimDaily(kind){
  if(kind==="play" && STATE.daily.played && !STATE.daily.claimPlay){
    STATE.daily.claimPlay=true; STATE.season.points+=CONFIG.dailyTaskPoints;
  }
  if(kind==="clear" && STATE.daily.cleared && !STATE.daily.claimClear){
    STATE.daily.claimClear=true; STATE.season.points+=CONFIG.dailyTaskPoints;
  }
  scheduleSave(); renderTasks(); toast("已領取 10 積分");
}
function claimChallenge(i){
  const goal=CONFIG.challengeGoals[i];
  if(STATE.season.wins>=goal && !STATE.season.claimed[i]){
    STATE.season.claimed[i]=true; STATE.season.points+=CONFIG.challengeTaskPoints;
    scheduleSave(); renderTasks(); toast("已領取 10 積分");
  }
}
function claimReward(r){
  const key=r.id+":"+STATE.season.index;
  if(STATE.season.points>=r.threshold && !STATE.season.rewardsClaimed.includes(key)){
    STATE.season.rewardsClaimed.push(key);
    // 賽季會循環重複使用同一批物件/背景/音樂模板，這裡用 includes 判斷避免重複塞入陣列造成重複項目
    const alreadyOwned = STATE.unlockedItems.includes(r.id);
    if(!alreadyOwned) STATE.unlockedItems.push(r.id);
    if(r.category==="music" && r.trackId && !STATE.music.unlocked.includes(r.trackId)){
      STATE.music.unlocked.push(r.trackId);
    }
    scheduleSave(); renderTasks();
    toast(alreadyOwned ? ("已再次領取："+r.name) : ("已解鎖："+r.name));
  }
}

/* =========================================================
   APP UPDATE（設定頁「更新到最新版本」）
   設計重點：
   1) 版本依據＝sw.js 裡的 SW_VERSION 數字常數，不是另外做一套跟它衝突的版號。
   2) 「目前版本」用 postMessage 直接詢問目前作用中的 Service Worker本人，
      「最新版本」則用 cache:"reload" 強制略過瀏覽器快取抓一份新的 sw.js 內文解析，
      這樣才不會被 iOS Safari 對 sw.js 的快取行為騙到，誤判成「沒有新版」。
   3) 真正的安裝／接管仍然完全交給瀏覽器內建的 Service Worker 生命週期
      （registration.update() → installing → installed（sw.js 內已呼叫 skipWaiting）
      → activating → activated → clients.claim() 觸發 controllerchange），
      絕對不是「呼叫 update 之後就直接 location.reload()」這種不可靠做法。
   4) 全程不會呼叫任何清除 IndexedDB / localStorage / Cache Storage 的動作；
      Cache Storage 的舊版清理完全由 sw.js 的 activate 事件自行處理，
      而且只會刪除「版本號不同的自家App快取」，不會影響玩家存檔。
   5)【修正】updatefound 與 controllerchange 都必須「先建立監聽，再呼叫 reg.update()」，
      否則事件可能在監聽器建立之前就已經發生而被錯過，導致誤判成沒有新版本、
      或是等不到 controllerchange 就以為更新失敗。見 attachUpdateListeners()。
   6)【修正】按下更新後，第一步一定先 flushSave()，確認目前進度真的寫進 IndexedDB
      （而不是還停留在 debounce 的 pending 狀態），寫入失敗就直接中止、不進行更新。
   7)【修正】register() 加上 updateViaCache:"none"，連 sw.js 本身都不透過瀏覽器 HTTP 快取，
      每次 update() 都是真的打網路要最新內容，避免「看起來更新完成，重開後還是舊版」這種
      根源其實出在 sw.js 本身被 HTTP 快取住的情況。
========================================================= */
let swRegistration = null;
let updateInProgress = false;

function querySwVersion(worker){
  return new Promise((resolve)=>{
    if(!worker){ resolve(null); return; }
    try{
      const channel = new MessageChannel();
      const timer = setTimeout(()=>resolve(null), 3000);
      channel.port1.onmessage = (e)=>{
        clearTimeout(timer);
        resolve(e.data && typeof e.data.version === "number" ? e.data.version : null);
      };
      worker.postMessage({type:"GET_VERSION"}, [channel.port2]);
    }catch(err){ resolve(null); }
  });
}

async function fetchLatestSwVersion(){
  // cache:"reload" 強制向伺服器要一份新的，避免拿到瀏覽器（尤其iOS Safari）快取住的舊 sw.js 內文
  const res = await fetch("./sw.js?_ts="+Date.now(), {cache:"reload"});
  if(!res.ok) throw new Error("無法取得 sw.js");
  const text = await res.text();
  const m = text.match(/SW_VERSION\s*=\s*(\d+)/);
  if(!m) throw new Error("sw.js 缺少版本常數");
  return parseInt(m[1],10);
}

async function getCurrentServiceWorker(){
  if(!("serviceWorker" in navigator)) return null;
  const reg = swRegistration || await navigator.serviceWorker.getRegistration();
  return (reg && (reg.active || reg.waiting || reg.installing)) || navigator.serviceWorker.controller || null;
}

async function refreshVersionLabel(){
  const label = $("#appVersionLabel");
  if(!label) return;
  if(!("serviceWorker" in navigator)){ label.textContent="不支援自動更新"; return; }
  const v = await querySwVersion(await getCurrentServiceWorker());
  label.textContent = (v!=null) ? ("v"+v) : "—";
}

function setUpdateStatus(msg){
  const el = $("#updateStatusText");
  if(el) el.textContent = msg || "";
}

// 幫任何 Promise 加上 timeout，逾時就 resolve(timeoutValue)，而不是掛著不動或直接判定失敗。
// 逾時之後原本的 promise 若真的完成，也只是被忽略，不會造成例外。
function withTimeout(promise, timeoutMs, timeoutValue){
  return new Promise((resolve)=>{
    let done=false;
    const timer = setTimeout(()=>{ if(!done){ done=true; resolve(timeoutValue); } }, timeoutMs);
    promise.then((v)=>{ if(!done){ done=true; clearTimeout(timer); resolve(v); } },
                 ()=>{ if(!done){ done=true; clearTimeout(timer); resolve(timeoutValue); } });
  });
}

// 【修正 updatefound race condition】
// 必須在呼叫 reg.update() 之前就呼叫這個函式，把 updatefound 與 controllerchange
// 的監聽都建立好，才不會因為「事件先發生、監聽後建立」而錯過。
// 如果 updatefound 在監聽建立前就已經發生，reg.installing / reg.waiting 會反映出目前狀態，
// 這裡一開始就會先檢查一次，兩邊互相補強。
function attachUpdateListeners(reg){
  const prevController = navigator.serviceWorker.controller;

  const workerFoundPromise = new Promise((resolve)=>{
    // updatefound 發生前，新版本有可能已經在 installing（例如上一次呼叫留下的狀態），先檢查一次。
    if(reg.installing){ resolve(reg.installing); return; }
    function onFound(){
      reg.removeEventListener("updatefound", onFound);
      resolve(reg.installing);
    }
    reg.addEventListener("updatefound", onFound);
  });

  // 【修正 controllerchange race condition】
  // 在 reg.update() 之前就建立好這個監聽，避免新版 SW 的 clients.claim()
  // 觸發 controllerchange 的時間點早於我們開始等待的時間點而被錯過。
  const controllerChangePromise = new Promise((resolve)=>{
    function onChange(){
      navigator.serviceWorker.removeEventListener("controllerchange", onChange);
      resolve();
    }
    navigator.serviceWorker.addEventListener("controllerchange", onChange);
  });

  return { prevController, workerFoundPromise, controllerChangePromise };
}

function waitForWorkerActivated(worker, timeoutMs){
  return new Promise((resolve,reject)=>{
    if(worker.state === "activated"){ resolve(); return; }
    if(worker.state === "redundant"){ reject(new Error("新版本安裝失敗")); return; }
    const timer = setTimeout(()=>{ worker.removeEventListener("statechange", onChange); reject(new Error("安裝逾時")); }, timeoutMs);
    function onChange(){
      if(worker.state === "activated"){ clearTimeout(timer); worker.removeEventListener("statechange", onChange); resolve(); }
      else if(worker.state === "redundant"){ clearTimeout(timer); worker.removeEventListener("statechange", onChange); reject(new Error("新版本安裝失敗")); }
    }
    worker.addEventListener("statechange", onChange);
  });
}

async function handleUpdateClick(){
  if(updateInProgress) return; // 【修正重複點擊】同一時間只允許一次更新流程
  const btn = $("#updateBtn");
  if(!("serviceWorker" in navigator)){ toast("此瀏覽器不支援自動更新"); return; }
  updateInProgress = true;
  btn.disabled = true;
  setUpdateStatus("正在檢查更新…");
  try{
    // 【P0】updateViaCache:"none" 明確要求瀏覽器連 sw.js 本身都不要用 HTTP 快取，
    // 每次 register()/update() 都直接打網路拿最新內容，避免被伺服器或瀏覽器對 sw.js 的
    // HTTP 快取行為騙到，造成「明明按了更新，實際上瀏覽器內部還是用舊的 sw.js 內容在比對」。
    const reg = swRegistration || await navigator.serviceWorker.register("./sw.js", {updateViaCache:"none"});
    swRegistration = reg;
    const currentWorker = (reg.active || reg.waiting || reg.installing) || navigator.serviceWorker.controller || null;
    const [currentVersion, latestVersion] = await Promise.all([
      querySwVersion(currentWorker),
      fetchLatestSwVersion()
    ]);
    if(currentVersion != null && latestVersion <= currentVersion){
      setUpdateStatus("目前已是最新版本");
      toast("目前已是最新版本");
      return;
    }

    // 【修正】更新前一定要先確保目前進度已經完整寫入 IndexedDB，
    // 而不是單純呼叫 scheduleSave() 就繼續往下走。寫入失敗就直接中止，保留舊版繼續運作。
    setUpdateStatus("正在儲存目前進度…");
    const saved = await flushSave();
    if(!saved){
      setUpdateStatus("更新失敗，已保留目前版本");
      toast("儲存進度失敗，已取消更新");
      return;
    }

    // 【修正 race condition 的關鍵】：一定要在 reg.update() 之前就建立好
    // updatefound 與 controllerchange 的監聽，不能依賴「事件一定會在監聽建立之後才發生」。
    const { prevController, workerFoundPromise, controllerChangePromise } = attachUpdateListeners(reg);

    setUpdateStatus("正在檢查更新…");
    await reg.update(); // 真正觸發瀏覽器檢查並安裝新版 Service Worker，不是只重整頁面

    // workerFoundPromise 在建立當下就已經檢查過 reg.installing；
    // 這裡逾時後再補查一次 reg.waiting / reg.installing，避免任何時間差造成誤判。
    let newWorker = await withTimeout(workerFoundPromise, 8000, null);
    if(!newWorker) newWorker = reg.waiting || reg.installing || null;

    if(!newWorker){
      // 沒偵測到新版本開始安裝：內容其實沒變，或本次暫時無法檢查，保留目前可用的版本
      setUpdateStatus("目前已是最新版本");
      toast("目前已是最新版本");
      return;
    }

    // 【P0 正確處理 waiting Service Worker】sw.js 的 install 事件本身已經會呼叫 skipWaiting()，
    // 正常情況下新版會自己很快從 installed 轉成 activating，不會卡在 waiting。
    // 這裡仍主動補發一次 SKIP_WAITING 訊息作為保險（sw.js 的 message handler 已支援、且重複收到也不會有副作用），
    // 避免任何原因造成新版卡在 installed/waiting 遲遲不進入 activate。
    if(newWorker.state === "installed" || newWorker.state === "waiting"){
      try{ newWorker.postMessage({type:"SKIP_WAITING"}); }catch(e){ /* 忽略：非致命，activate 仍會照常等待/重試 */ }
    }

    setUpdateStatus("正在套用新版本…");
    await waitForWorkerActivated(newWorker, 15000); // install → activate（sw.js 內已呼叫 skipWaiting）

    setUpdateStatus("正在套用新版本…");
    // controllerChangePromise 早在 reg.update() 之前就已經在監聽，
    // 所以就算新版 activate 後的 clients.claim() 很快觸發 controllerchange，也不會被錯過。
    await withTimeout(controllerChangePromise, 6000, null);

    // 不管 controllerchange 是否在時間內發生，reload 前都再次「確認」新版真的接管了，
    // 逾時不代表更新失敗，也不代表更新成功——一律以目前 controller 是否真的換掉舊的為準。
    const controllerSwitched = ()=> navigator.serviceWorker.controller && navigator.serviceWorker.controller !== prevController;
    if(!controllerSwitched()){
      await withTimeout(new Promise((resolve)=>{
        (function poll(){
          if(controllerSwitched()) resolve();
          else setTimeout(poll, 200);
        })();
      }), 3000, null);
    }

    if(!controllerSwitched()){
      // 新版 Service Worker 尚未真正接管此頁面：不能假裝更新成功，也不能 reload，
      // 保留目前舊版繼續運作，讓使用者之後再試一次。
      setUpdateStatus("更新失敗，已保留目前版本");
      toast("更新失敗，已保留目前版本");
      return;
    }

    setUpdateStatus("更新完成，正在重新載入…");
    location.reload();
  }catch(err){
    console.warn("[update] failed:", err);
    setUpdateStatus("更新失敗，已保留目前版本");
    toast("更新失敗，已保留目前版本");
  }finally{
    updateInProgress = false;
    btn.disabled = false;
  }
}

/* =========================================================
   PERIODIC RECONCILE (stamina / season / daily rollover while app open)
========================================================= */
setInterval(()=>{
  reconcileStamina(); reconcileDaily(); reconcileSeason();
  if(document.getElementById("stageScreen").classList.contains("active")) renderStage();
  scheduleSave();
}, 15000);

/* =========================================================
   BOOT
========================================================= */
document.addEventListener("pointerdown", AudioSys.unlockOnGesture, {once:false});
if("serviceWorker" in navigator){
  window.addEventListener("load", async ()=>{
    try{ swRegistration = await navigator.serviceWorker.register("./sw.js", {updateViaCache:"none"}); }
    catch(e){ /* 離線或環境不支援時，App 仍可正常使用，只是沒有離線快取／自動更新而已 */ }
  });
}
(async function boot(){
  await loadState();
  renderHome();
  showScreen("homeScreen");
})();

})();
</script>
